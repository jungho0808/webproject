<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>항목 뽑기</title>
    <link rel="stylesheet" href="style.css">
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4559851194876660"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-4559851194876660">
</head>
<body>
    <div class="container">
        <header>
            <h1><a href="index.html">무작위 추첨</a></h1>
            <nav>
                <a href="gacha.html">항목 뽑기</a>
                <a href="roulette.html">룰렛 돌리기</a>
                <a href="pinball.html">핀볼 추첨</a>
                <a href="about.html">소개</a>
                <a href="contact.html">문의하기</a>
            </nav>
        </header>
        <main>
            <h2>항목 뽑기</h2>
            <p>점심 메뉴, 발표 순서, 청소 당번 등 어떤 것이든 목록을 만들어 무작위로 하나를 뽑아보세요. 고민되는 선택지들을 아래 상자에 한 줄에 하나씩 입력하고 '뽑기!' 버튼을 누르면, 공정하게 하나가 선택됩니다.</p>
            <textarea id="item-input" rows="10" placeholder="예시)&#10;짜장면&#10;짬뽕&#10;볶음밥&#10;탕수육"></textarea>
            <button id="draw-button">뽑기!</button>
            <div class="result-container">
                <h3>결과:</h3>
                <p id="result-display"></p>
            </div>
        </main>
        <footer>
            <p>&copy; 2024 Random Drawer | <a href="privacy.html">개인정보처리방침</a> | <a href="about.html">소개</a> | <a href="contact.html">문의하기</a></p>
        </footer>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const drawButton = document.getElementById('draw-button');
            const itemInput = document.getElementById('item-input');
            const resultDisplay = document.getElementById('result-display');

            drawButton.addEventListener('click', () => {
                const items = itemInput.value.split('\n').filter(item => item.trim() !== '');

                if (items.length === 0) {
                    resultDisplay.textContent = '추첨할 항목을 입력하세요.';
                    return;
                }

                const randomIndex = Math.floor(Math.random() * items.length);
                const randomItem = items[randomIndex];

                resultDisplay.textContent = randomItem;
            });
        });
    </script>
</body>
</html>
