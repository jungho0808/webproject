<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 작성</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script type="module" src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js"></script>
    <script type="module" src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js"></script>
    <script type="module" src="firebase-init.js"></script>
    
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4559851194876660"
     crossorigin="anonymous"></script>
    <meta name="google-adsense-account" content="ca-pub-4559851194876660">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>
    <div class="write-container">
        <h1>글 작성</h1>
        <form id="write-form">
            <label for="title">제목:</label>
            <input type="text" id="title" name="title" required>

            <label for="content">내용:</label>
            <textarea id="content" name="content" rows="10" required></textarea>

            <button type="submit">작성하기</button>
        </form>
    </div>
    <script type="module">
        import { db } from './firebase-init.js';
        import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";

        document.getElementById('write-form').addEventListener('submit', async function(event) {
            event.preventDefault();

            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;
            const author = '익명'; // For now, author is anonymous

            if (title && content) {
                try {
                    await addDoc(collection(db, 'posts'), {
                        title: title,
                        content: content,
                        author: author,
                        date: new Date().toISOString().slice(0, 10), // YYYY-MM-DD
                        timestamp: serverTimestamp(),
                        views: 0
                    });
                    alert('글이 성공적으로 작성되었습니다!');
                    window.location.href = 'index.html';
                } catch (e) {
                    console.error("Error adding document: ", e);
                    alert('글 작성에 실패했습니다.');
                }
            } else {
                alert('제목과 내용을 모두 입력해주세요.');
            }
        });
    </script>
    <footer>
        <div class="footer-links">
            <a href="index.html">Home</a> |
            <a href="contact.html">제휴 문의</a> |
            <a href="privacy.html">개인정보처리방침</a>
        </div>
        <p>&copy; 2024 My Forum</p>
    </footer>
</body>
</html>
