<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무작위 추첨 사이트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>무작위 추첨</h1>
        </header>
        <main>
            <div class="gacha-container">
                <h2>항목 뽑기</h2>
                <p>추첨할 항목들을 한 줄에 하나씩 입력하세요.</p>
                <textarea id="item-input" rows="10" placeholder="예시)&#10;사과&#10;바나나&#10;오렌지"></textarea>
                <button id="draw-button">뽑기!</button>
                <div class="result-container">
                    <h3>결과:</h3>
                    <p id="result-display"></p>
                </div>
            </div>
        </main>
        <footer>
            <p>&copy; 2024 Random Drawer</p>
        </footer>
    </div>
    <script src="main.js"></script>
</body>
</html>
